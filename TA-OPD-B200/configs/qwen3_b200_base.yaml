# Shared source of truth. The bash wrappers expose TRAIN_BATCH_SIZE and apply the
# same value to rollout and micro-batch. Optional autotune remains available.
experiment:
  method: base
  seed: 1234
  output_dir: outputs/base_unused
  require_b200: true
  allow_existing_output: false
  verbose_metrics: false

# scripts/train_{ta,rac}_b200.sh automatically launches one DDP worker per
# CUDA_VISIBLE_DEVICES entry. rollout.batch_size and training.micro_batch_size
# remain GLOBAL values, independent of GPU count.
distributed:
  backend: nccl
  find_unused_parameters: false
  gradient_as_bucket_view: true
  static_graph: true
  bucket_cap_mb: 100

models:
  teacher_path: /workspace/storage-shared/models/Qwen3-4B
  student_path: /workspace/storage-shared/models/Qwen3-1.7B
  dtype: bfloat16
  attention_implementation: auto

data:
  path: /workspace/storage-shared/nlp/minhpn19/data/DAPO-Math-17k-Processed
  # The root also contains language-specific mirrors; "all" is the complete
  # 17k split and avoids duplicating cn/en rows.
  split: all
  prompt_key: prompt
  prefer_source_prompt: false
  max_prompt_tokens: 512
  chat_template_kwargs:
    enable_thinking: true

rollout:
  # Default training rollout uses a persistent, same-GPU vLLM server. Student
  # weights are synchronized through CUDA IPC before every optimizer step.
  backend: vllm
  batch_size: 8
  max_new_tokens: 2048
  temperature: 1.0
  top_p: 1.0
  seed: 42
  vllm:
    # This is a co-located engine reservation, not an evaluation sample limit.
    # It sleeps at level 2 while HF student/teacher scoring and backward run.
    gpu_memory_utilization: 0.25
    max_num_seqs: 8
    # 512 prompt + 2048 generated tokens fit with ample context headroom.
    max_model_len: 4096
    max_concurrent_requests: 8
    # Release the trainer CUDA cache only when the sleeping engine otherwise
    # cannot wake with this safety margin; avoid empty_cache on every step.
    wake_headroom_gib: 2
    enable_prefix_caching: true
    startup_timeout: 600
    control_timeout: 600
    generation_timeout: 3600

selector:
  top_k: 16
  branch_m: 4
  eps: 1.0e-8
  q_low: 0.05
  q_high: 0.95
  rac_delta_mode: full_vocab
  rac_probe_mode: kv_cache
  rac_branch_chunk_size: 256
  validate_kv_cache: true
  kv_cache_tolerance: 0.04

token_budget:
  rho: 0.10

training:
  epochs: 1
  max_steps: null
  # Set through RESUME_FROM_CHECKPOINT in the bash wrappers. MAX_STEPS remains
  # the total target step (not the number of extra steps after resume).
  resume_from_checkpoint: null
  resume_allow_config_mismatch: false
  micro_batch_size: 8
  learning_rate: 1.0e-5
  adam_betas: [0.9, 0.95]
  weight_decay: 0.0
  ppo_clip_low: 0.2
  ppo_clip_high: 0.28
  max_grad_norm: 1.0
  use_lora: false
  gradient_checkpointing: false
  fused_optimizer: true
  empty_cuda_cache_each_step: false
  save_checkpoints: true
  save_interval: 100
  save_optimizer: true

logging:
  selected_tokens_enabled: true
  selector_chunk_steps: 50

# By default, evaluation is spread evenly over the measured number of optimizer
# steps. vLLM runs in a short-lived subprocess so its engine memory is returned
# before training resumes. "hf" remains available as a low-dependency fallback.
training_evaluation:
  enabled: true
  backend: vllm
  target_evaluations: 16
  interval_steps: null
  eval_at_start: true
  eval_at_end: true
  benchmark_names: [MATH-500, AIME24, AIME25]
  # Used only by the Hugging Face fallback backend.
  batch_size: 16
  max_new_tokens: 2048
  limit: null
  output_subdir: training_eval
  vllm:
    tensor_parallel_size: 1
    # Dynamically consume almost all currently-free VRAM. The training process
    # remains resident, so using a hard-coded 1.0 would incorrectly claim it.
    gpu_memory_utilization: auto
    gpu_headroom_gib: 4
    max_num_seqs: 256
    max_model_len: 4096
    enable_prefix_caching: true
    seed: 1234

autotune:
  # Seven candidates make binary search exactly <=3 probes per method. The
  # upper range is intentional for 180+ GiB B200; the 90% guard rejects it if
  # full-parameter backward or RAC scoring leaves insufficient headroom.
  batch_candidates: [16, 32, 64, 96, 128, 160, 192]
  max_reserved_fraction: 0.90

evaluation:
  backend: vllm
  batch_size: 16
  max_new_tokens: 2048
  limit: null
  vllm:
    tensor_parallel_size: 1
    gpu_memory_utilization: auto
    gpu_headroom_gib: 4
    max_num_seqs: 256
    max_model_len: 4096
    enable_prefix_caching: true
    seed: 1234
  benchmarks:
    MATH-500:
      path: /workspace/storage-shared/nlp/minhpn19/data/eval/math500
    AIME24:
      path: /workspace/storage-shared/nlp/minhpn19/data/eval/aime24/test-00000-of-00001.parquet
    AIME25:
      path: /workspace/storage-shared/nlp/minhpn19/data/eval/aime25/test.jsonl

plotting:
  smoothing_window: 10
